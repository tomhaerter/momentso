name: Code quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Oxlint and oxfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint

      - name: Check formatting with oxfmt
        run: npm run fmt:check
